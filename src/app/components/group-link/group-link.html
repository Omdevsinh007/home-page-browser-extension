<div class="shortcut select-none" [class.is-compact]="variant() === 'compact'">
  @if (variant() === 'compact') {
    <button type="button" data-testid="pill" class="shortcut-pill glass glass-strong on-glass" [title]="quickLink().name"
      [attr.aria-label]="'Open group ' + quickLink().name" (click)="open.emit()" (contextmenu)="openMenu($event)">
      <span class="shortcut-icon"><app-favicon [url]="preview()[0]?.url ?? ''" [name]="quickLink().name" [displaySize]="16" /></span>
      <span class="shortcut-name">{{ quickLink().name }}</span>
      <span class="shortcut-count" aria-hidden="true">{{ linkCount() }}</span>
    </button>
  } @else {
    <button type="button" matRipple class="shortcut-tile glass on-glass" [attr.aria-label]="'Open group ' + quickLink().name"
      (click)="open.emit()" (contextmenu)="openMenu($event)">
      <span class="shortcut-quad">
        @for (link of preview(); track link.id) {
          <span class="shortcut-icon"><app-favicon [url]="link.url" [name]="link.name" [displaySize]="16" /></span>
        }
      </span>
      <span class="shortcut-name" [title]="quickLink().name">{{ quickLink().name }}</span>
    </button>
  }

  <button type="button" class="shortcut-more" [attr.aria-label]="'Options for ' + quickLink().name" data-menu-origin #origin ngMenuTrigger #trigger="ngMenuTrigger" [menu]="menu()">
    <mat-icon svgIcon="more_horiz" aria-hidden="true" />
  </button>
</div>

<ng-template [cdkConnectedOverlay]="{ origin, usePopover: 'inline' }" [cdkConnectedOverlayOpen]="trigger.expanded()"
  [cdkConnectedOverlayPositions]="positions" [cdkConnectedOverlayViewportMargin]="margin" cdkAttachPopoverAsChild>
  <div ngMenu #groupMenu="ngMenu" class="popover-menu" (itemSelected)="onSelected($event)" (contextmenu)="$event.preventDefault()">
    <ng-template ngMenuContent>
      <div ngMenuItem class="popover-item" value="rename">Rename</div>
      <div ngMenuItem class="popover-item danger" value="delete">Delete</div>
    </ng-template>
  </div>
</ng-template>
