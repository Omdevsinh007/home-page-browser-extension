<div class="group-dialog-wrapper flex h-full">
  <!-- Sidebar -->
  <div class="group-sidebar w-48 border-r border-white/10 flex flex-col bg-black/20">
    <div class="p-4 text-white font-semibold text-lg border-b border-white/10">Groups</div>
    <div class="sidebar-scroll custom-scroll flex-1 overflow-y-auto">
      @for (group of allGroups(); track group.id) {
      <div
        class="sidebar-item px-4 py-3 cursor-pointer text-white/80 hover:text-white hover:bg-white/10 transition-colors"
        [class.!bg-white/20]="group.id === shortcutData().id" (click)="switchGroup(group)">
        {{ group.name }}
      </div>
      }
    </div>
  </div>

  <!-- Main Content -->
  <div class="group-content flex-1 flex flex-col relative h-full min-w-0">
    <div mat-dialog-title class="!text-white flex justify-between items-center relative !pr-24">
      {{ shortcutData().name }}
    </div>

    <div class="absolute top-3 right-3 z-50 flex items-center gap-1">
      <button mat-icon-button [matMenuTriggerFor]="editMenu"
        class="!flex !items-center !justify-center !text-white/70 hover:!text-white">
        <mat-icon>more_vert</mat-icon>
      </button>
      <button mat-icon-button (click)="closeGroup()"
        class="!flex !items-center !justify-center !text-white/70 hover:!text-white">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-dialog-content class="custom-scroll relative flex-1">
      <div class="grid grid-cols-[repeat(auto-fill,144px)] justify-center select-none" cdkDropListOrientation="mixed"
        cdkDropList (cdkDropListDropped)="drop($event)">
        @if (shortcutData() && shortcutData().group && shortcutData().group!.length > 0) {
        @for (link of shortcutData().group!; track $index) {
        <div class="p-4" cdkDrag>
          <div class="custom-shortcut-placeholder rounded-md m-4" *cdkDragPlaceholder>
            <div class="w-28 rounded-md"></div>
          </div>
          <app-link [quickLink]="link" [index]="$index" (editIndex)="editShortcut($event)"
            (removeShortcut)="removeShortcut($event)" />
        </div>
        }
        }
        <div class="flex justify-center py-4">
          <div class="add-links flex justify-center items-center group hover:backdrop-blur-lg hover:bg-white/5">
            <div matRipple [matMenuTriggerFor]="addMenu"
              class="transition-all duration-300 ease-in-out cursor-pointer w-10 h-10 text-center flex justify-center items-center rounded-full backdrop-blur-md bg-white/10 group-hover:backdrop-blur-3xl group-hover:bg-black/5">
              <mat-icon class="!text-white">add</mat-icon>
            </div>
          </div>
        </div>
      </div>
    </mat-dialog-content>
  </div>
</div>

<mat-menu #addMenu="matMenu"
  class="!bg-black/60 !backdrop-blur-xl !border !border-white/10 !rounded-xl !p-1 !min-w-[150px] !shadow-2xl">
  <button mat-menu-item (click)="addShortcut()"
    class="!text-white hover:!bg-white/10 !transition-colors !rounded-lg !mb-0">Add shortcut</button>
</mat-menu>

<mat-menu #editMenu="matMenu"
  class="!bg-black/60 !backdrop-blur-xl !border !border-white/10 !rounded-xl !p-1 !min-w-[150px] !shadow-2xl">
  <button mat-menu-item (click)="editGroup()"
    class="!text-white hover:!bg-white/10 !transition-colors !rounded-lg !mb-0">Edit</button>
  <button mat-menu-item (click)="removeGroup(shortcutData().id)"
    class="!text-red-400 hover:!bg-red-400/10 !transition-colors !rounded-lg">Remove</button>
</mat-menu>
