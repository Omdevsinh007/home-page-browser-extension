<div class="group-dialog-wrapper flex h-full flex-col md:flex-row">
  <!-- Group switcher: sidebar on wide dialogs, select on narrow ones -->
  <nav class="group-sidebar hidden w-48 shrink-0 flex-col border-r border-white/10 bg-black/20 md:flex" aria-label="Groups">
    <div class="border-b border-white/10 p-4 text-lg font-semibold text-white">Groups</div>
    <div class="custom-scroll flex-1 overflow-y-auto">
      @for (g of groups(); track g.id) {
        <button
          type="button"
          class="block w-full truncate px-4 py-3 text-left text-white/80 transition-colors hover:bg-white/10 hover:text-white focus-visible:bg-white/10 outline-none"
          [class.!bg-white/20]="g.id === group()?.id"
          [attr.aria-current]="g.id === group()?.id ? 'true' : null"
          (click)="select(g.id)"
        >
          {{ g.name }}
        </button>
      }
    </div>
  </nav>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center gap-2 px-5 pt-4 pb-3">
      <select
        class="rounded-md border border-white/20 bg-black/40 px-2 py-1 text-white md:hidden"
        aria-label="Switch group"
        [value]="group()?.id"
        (change)="select($any($event.target).value)"
      >
        @for (g of groups(); track g.id) {
          <option [value]="g.id">{{ g.name }}</option>
        }
      </select>
      <h2 class="hidden truncate text-xl font-medium text-white md:block" id="group-dialog-title">{{ group()?.name }}</h2>
      <span class="ml-auto flex items-center gap-1">
        <button type="button" class="dialog-icon-btn" aria-label="Add section" (click)="addSection()">
          <mat-icon svgIcon="playlist_add" />
        </button>
        <button type="button" class="dialog-icon-btn" aria-label="Group options" [matMenuTriggerFor]="groupMenu">
          <mat-icon svgIcon="more_vert" />
        </button>
        <button type="button" class="dialog-icon-btn" aria-label="Close" (click)="close()">
          <mat-icon svgIcon="close" />
        </button>
      </span>
    </header>

    @if (group(); as g) {
      <div class="custom-scroll min-h-0 flex-1 overflow-auto px-5 pb-5">
        <div
          class="columns"
          cdkDropList
          cdkDropListOrientation="mixed"
          (cdkDropListDropped)="dropSection($event)"
        >
          <div class="columns-inner" cdkDropListGroup>
            @for (section of sections(); track section.id) {
              <app-section-column cdkDrag [cdkDragData]="section.id" [group]="g" [section]="section" />
            }
            <button type="button" class="add-section" (click)="addSection()">
              <mat-icon svgIcon="add" />
              <span>Add section</span>
            </button>
          </div>
        </div>
      </div>
    } @else {
      <p class="p-6 text-white/70">This group no longer exists.</p>
    }
  </div>
</div>

<mat-menu #groupMenu="matMenu" class="glass-menu">
  <button mat-menu-item (click)="renameGroup()">Rename group</button>
  @for (section of sections(); track section.id; let i = $index) {
    @if (i > 0) {
      <button mat-menu-item (click)="moveSectionBy(section.id, -1)">Move “{{ section.name }}” left</button>
    }
  }
  <button mat-menu-item class="danger" (click)="deleteGroup()">Delete group</button>
</mat-menu>
