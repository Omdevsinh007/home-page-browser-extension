<div class="content-wrap">
  @if (bg.active(); as active) {
  @if (active.meta.type === 'video') {
  <video [src]="active.objectUrl" [style.object-fit]="active.meta.objectFit"
    [style.filter]="'brightness(' + active.meta.brightness + '%) blur(' + active.meta.blur + 'px)'"
    autoplay loop muted playsinline disablePictureInPicture class="video" aria-hidden="true">
  </video>
  } @else {
  <img [src]="active.objectUrl" [style.object-fit]="active.meta.objectFit"
    [style.filter]="'brightness(' + active.meta.brightness + '%) blur(' + active.meta.blur + 'px)'" class="video" alt="">
  }
  }

  <div class="container w-full z-10 px-4">
    <app-search-box class="relative z-30 mb-6" />
    <div class="grid grid-cols-[repeat(auto-fill,144px)] justify-center" cdkDropListOrientation="mixed" cdkDropList
      (cdkDropListDropped)="drop($event)">
      @for (link of store.items(); track link.id) {
      <div class="!p-4" cdkDrag>
        <div class="custom-shortcut-placeholder rounded-md m-4" *cdkDragPlaceholder>
          <div class="w-28 rounded-md">
          </div>
        </div>
        @if (link.type === "Shortcut") {
        <app-link [quickLink]="link" (removeShortcut)="removeTile(link)" (editShortcut)="editShortcut(link)" />
        } @else {
        <app-group-link [quickLink]="link" (open)="openGroup(link)" (rename)="renameGroup(link)" (removeLink)="removeTile(link)" />
        }
      </div>
      }
      <div class="flex justify-center py-4">
        <div
          class="add-links flex justify-center items-center group hover:backdrop-blur-lg hover:bg-white/5 transition-all duration-300 ease-in-out hover:scale-105 active:scale-95">
          <div matRipple
            class="w-10 h-10 text-center flex justify-center items-center rounded-full backdrop-blur-md bg-white/10 group-hover:backdrop-blur-3xl group-hover:bg-white/20 transition-all duration-300 shadow-sm"
            [matMenuTriggerFor]="addMenu">
            <mat-icon class="!text-white">add</mat-icon>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Management Floating Button (Invisible until hover) -->
  <div class="absolute top-6 right-6 z-50 opacity-0 hover:opacity-100 transition-opacity duration-300 flex gap-2">
    <button
      class="glass-button hover:cursor-pointer w-10 h-10 rounded-full flex justify-center items-center group shadow-sm bg-white/10 backdrop-blur-md"
      [matMenuTriggerFor]="dataMenu">
      <mat-icon class="text-white group-hover:rotate-90 transition-transform">more_vert</mat-icon>
    </button>
  </div>

  <!-- Background manager -->
  <div class="absolute bottom-6 right-6 z-50">
    <button type="button" (click)="openBackgrounds()" aria-label="Backgrounds"
      class="glass-button hover:cursor-pointer w-12 h-12 rounded-full flex justify-center items-center group transition-all hover:scale-110">
      <mat-icon class="text-white group-hover:rotate-12 transition-transform">wallpaper</mat-icon>
    </button>
  </div>
</div>

<mat-menu #addMenu="matMenu"
  class="!bg-black/60 !backdrop-blur-xl !border !border-white/10 !rounded-xl !p-1 !min-w-[150px] !shadow-2xl">
  <button mat-menu-item (click)="addShortcut()"
    class="!text-white hover:!bg-white/10 !transition-colors !rounded-lg !mb-0">Add shortcut</button>
  <button mat-menu-item (click)="addGroup()" class="!text-white hover:!bg-white/10 !transition-colors !rounded-lg">Add
    group</button>
</mat-menu>

<mat-menu #dataMenu="matMenu"
  class="!bg-black/60 !backdrop-blur-xl !border !border-white/10 !rounded-xl !p-1 !min-w-[180px] !shadow-2xl">
  <button mat-menu-item (click)="data.exportAll()" class="!text-white hover:!bg-white/10 !rounded-lg">
    <mat-icon class="!text-white">download</mat-icon>
    <span>Export data</span>
  </button>
  <button mat-menu-item (click)="data.exportForV2x()" class="!text-white hover:!bg-white/10 !rounded-lg">
    <mat-icon class="!text-white">history</mat-icon>
    <span>Export for v2.x</span>
  </button>
  <button mat-menu-item (click)="fileInput.click()" class="!text-white hover:!bg-white/10 !rounded-lg">
    <mat-icon class="!text-white">upload</mat-icon>
    <span>Import data</span>
  </button>
  <button mat-menu-item (click)="data.downloadBackups()" class="!text-white hover:!bg-white/10 !rounded-lg">
    <mat-icon class="!text-white">backup</mat-icon>
    <span>Download backups</span>
  </button>
</mat-menu>
<input type="file" #fileInput accept=".json" class="hidden" (change)="onImportData($event)">
